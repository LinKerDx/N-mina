# ---------------------------------------------------------------------------
# NÃ³mina360 â€” stack completo de desarrollo.
# Una instancia PostgreSQL por Ã¡rea (database-per-service).
# ---------------------------------------------------------------------------
name: nomina360

services:
  # ----------------------------- Bases de datos -----------------------------
  db-auth:
    image: postgres:16-alpine
    container_name: nomina360-db-auth
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-nomina_auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_pass}
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [nomina-net]

  db-rh:
    image: postgres:16-alpine
    container_name: nomina360-db-rh
    environment:
      POSTGRES_DB: ${RH_DB_NAME:-rh_db}
      POSTGRES_USER: ${RH_DB_USER:-nomina_rh}
      POSTGRES_PASSWORD: ${RH_DB_PASSWORD:-rh_dev_pass}
    ports:
      - "5434:5432"
    volumes:
      - rh_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [nomina-net]

  db-produccion:
    image: postgres:16-alpine
    container_name: nomina360-db-produccion
    environment:
      POSTGRES_DB: ${PRODUCCION_DB_NAME:-produccion_db}
      POSTGRES_USER: ${PRODUCCION_DB_USER:-nomina_produccion}
      POSTGRES_PASSWORD: ${PRODUCCION_DB_PASSWORD:-produccion_dev_pass}
    ports:
      - "5435:5432"
    volumes:
      - produccion_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [nomina-net]

  db-admin:
    image: postgres:16-alpine
    container_name: nomina360-db-admin
    environment:
      POSTGRES_DB: ${ADMIN_DB_NAME:-admin_db}
      POSTGRES_USER: ${ADMIN_DB_USER:-nomina_admin}
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD:-admin_dev_pass}
    ports:
      - "5436:5432"
    volumes:
      - admin_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [nomina-net]

  # ------------------------------- MensajerÃ­a -------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nomina360-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nomina}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nomina_dev_pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nomina-net]

  # ------------------------------ Microservicios ----------------------------
  auth-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: auth-service
    container_name: nomina360-auth
    environment:
      SERVER_PORT: 8081
      AUTH_DB_URL: jdbc:postgresql://db-auth:5432/${AUTH_DB_NAME:-auth_db}
      AUTH_DB_USER: ${AUTH_DB_USER:-nomina_auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789ABCDEFGHIJ}
      JWT_ISSUER: ${JWT_ISSUER:-nomina360}
      NOMINA_DATOS_INICIALES_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      db-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [nomina-net]

  rh-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: rh-service
    container_name: nomina360-rh
    environment:
      SERVER_PORT: 8082
      RH_DB_URL: jdbc:postgresql://db-rh:5432/${RH_DB_NAME:-rh_db}
      RH_DB_USER: ${RH_DB_USER:-nomina_rh}
      RH_DB_PASSWORD: ${RH_DB_PASSWORD:-rh_dev_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-nomina}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-nomina_dev_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789ABCDEFGHIJ}
      JWT_ISSUER: ${JWT_ISSUER:-nomina360}
    ports:
      - "8082:8082"
    depends_on:
      db-rh:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [nomina-net]

  produccion-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: produccion-service
    container_name: nomina360-produccion
    environment:
      SERVER_PORT: 8083
      PRODUCCION_DB_URL: jdbc:postgresql://db-produccion:5432/${PRODUCCION_DB_NAME:-produccion_db}
      PRODUCCION_DB_USER: ${PRODUCCION_DB_USER:-nomina_produccion}
      PRODUCCION_DB_PASSWORD: ${PRODUCCION_DB_PASSWORD:-produccion_dev_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-nomina}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-nomina_dev_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789ABCDEFGHIJ}
      JWT_ISSUER: ${JWT_ISSUER:-nomina360}
    ports:
      - "8083:8083"
    depends_on:
      db-produccion:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [nomina-net]

  administracion-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: administracion-service
    container_name: nomina360-administracion
    environment:
      SERVER_PORT: 8084
      ADMIN_DB_URL: jdbc:postgresql://db-admin:5432/${ADMIN_DB_NAME:-admin_db}
      ADMIN_DB_USER: ${ADMIN_DB_USER:-nomina_admin}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-admin_dev_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789ABCDEFGHIJ}
      JWT_ISSUER: ${JWT_ISSUER:-nomina360}
    ports:
      - "8084:8084"
    depends_on:
      db-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [nomina-net]

  api-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: api-gateway
    container_name: nomina360-gateway
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      RH_SERVICE_URL: http://rh-service:8082
      PRODUCCION_SERVICE_URL: http://produccion-service:8083
      ADMIN_SERVICE_URL: http://administracion-service:8084
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789ABCDEFGHIJ}
      JWT_ISSUER: ${JWT_ISSUER:-nomina360}
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      rh-service:
        condition: service_started
      produccion-service:
        condition: service_started
      administracion-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [nomina-net]

  # --------------------------------- Frontend -------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: nomina360-web
    ports:
      - "8088:80"
    depends_on:
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [nomina-net]

volumes:
  auth_db_data:
  rh_db_data:
  produccion_db_data:
  admin_db_data:
  rabbitmq_data:

networks:
  nomina-net:
    driver: bridge

