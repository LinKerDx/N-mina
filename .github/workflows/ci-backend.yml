name: CI · Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-probar:
    name: Compilar y probar (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        run: mvn -B -ntp -f backend/pom.xml verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore

  imagenes:
    name: Build imagen ${{ matrix.service }}
    needs: compilar-y-probar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - rh-service
          - produccion-service
          - administracion-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: false
          tags: nomina360/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
