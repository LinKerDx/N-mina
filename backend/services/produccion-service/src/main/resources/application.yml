server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: produccion-service
  datasource:
    url: ${PRODUCCION_DB_URL:jdbc:postgresql://localhost:5435/produccion_db}
    username: ${PRODUCCION_DB_USER:nomina_produccion}
    password: ${PRODUCCION_DB_PASSWORD:produccion_dev_pass}
    hikari:
      pool-name: produccion-pool
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nomina}
    password: ${RABBITMQ_PASSWORD:nomina_dev_pass}
  lifecycle:
    timeout-per-shutdown-phase: 20s

nomina:
  outbox:
    intervalo-ms: 5000

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789ABCDEFGHIJ}
    issuer: ${JWT_ISSUER:nomina360}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}] [user:%X{usuarioId:-}]"
  level:
    mx.nomina360: INFO
