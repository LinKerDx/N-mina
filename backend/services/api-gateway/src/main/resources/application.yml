server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: rh-service
          uri: ${RH_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/rh/**
        - id: produccion-service
          uri: ${PRODUCCION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/produccion/**
        - id: administracion-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/administracion/**
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-Correlation-Id
            allowCredentials: true
            maxAge: 3600
  lifecycle:
    timeout-per-shutdown-phase: 20s

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789ABCDEFGHIJ}
    issuer: ${JWT_ISSUER:nomina360}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"
  level:
    mx.nomina360: INFO
