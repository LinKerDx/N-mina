name: Publicar imágenes (GHCR)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de las imágenes"
        required: true
        default: "edge"

permissions:
  contents: read
  packages: write

env:
  REGISTRO: ghcr.io
  PROPIETARIO: ${{ github.repository_owner }}

jobs:
  imagenes-servicios:
    name: Imagen ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - rh-service
          - produccion-service
          - administracion-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Calcular versión
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "valor=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRO }}/${{ env.PROPIETARIO }}/nomina360-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.version.outputs.valor }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  imagen-web:
    name: Imagen web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular versión
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "valor=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRO }}/${{ env.PROPIETARIO }}/nomina360-web
          tags: |
            type=raw,value=${{ steps.version.outputs.valor }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
