server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${AUTH_DB_USER:nomina_auth}
    password: ${AUTH_DB_PASSWORD:auth_dev_pass}
    hikari:
      pool-name: auth-pool
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

security:
  http:
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/chat/ws
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789ABCDEFGHIJ}
    issuer: ${JWT_ISSUER:nomina360}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}] [user:%X{usuarioId:-}]"
  level:
    mx.nomina360: INFO
